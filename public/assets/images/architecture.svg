<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Arquitectura del sistema AIDA+">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#00e5ff"/>
    </marker>
    <style>
      .box{fill:#141d2e;stroke:#2a3a56;stroke-width:2}
      .lbl{fill:#dbe6f5;font-family:monospace;font-size:15px;text-anchor:middle}
      .sub{fill:#7f8ea5;font-family:monospace;font-size:11.5px;text-anchor:middle}
      .ln{stroke:#00e5ff;stroke-width:2;fill:none;marker-end:url(#arw);opacity:.85}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <text x="40" y="52" fill="#00e5ff" font-family="monospace" font-size="15" letter-spacing="4">ARQUITECTURA</text>
  <text x="40" y="76" fill="#7f8ea5" font-family="monospace" font-size="12" letter-spacing="2">NODO CENTRAL · ESCLAVOS · BROKER</text>

  <rect class="box" x="60" y="120" width="150" height="80" rx="12"/>
  <text class="lbl" x="135" y="155">ESP32</text>
  <text class="sub" x="135" y="176">sensores</text>

  <rect class="box" x="60" y="250" width="150" height="80" rx="12"/>
  <text class="lbl" x="135" y="285">ESP32</text>
  <text class="sub" x="135" y="306">actuadores</text>

  <rect class="box" x="315" y="185" width="170" height="90" rx="12"/>
  <text class="lbl" x="400" y="220">MOSQUITTO</text>
  <text class="sub" x="400" y="241">aida/telemetry</text>

  <rect class="box" x="590" y="120" width="150" height="80" rx="12"/>
  <text class="lbl" x="665" y="155">NODE-RED</text>
  <text class="sub" x="665" y="176">dashboard</text>

  <rect class="box" x="590" y="250" width="150" height="80" rx="12"/>
  <text class="lbl" x="665" y="285">FIREBASE</text>
  <text class="sub" x="665" y="306">historial</text>

  <path class="ln" d="M210 160 C260 160 270 210 312 218"/>
  <path class="ln" d="M210 290 C260 290 270 250 312 242"/>
  <path class="ln" d="M485 210 C540 190 545 170 588 162"/>
  <path class="ln" d="M485 250 C540 270 545 285 588 288"/>
  <path class="ln" d="M665 200 L665 248" marker-end="url(#arw)"/>

  <g fill="#7f8ea5" font-family="monospace" font-size="11.5">
    <text x="225" y="122">MQTT / WiFi</text>
    <text x="500" y="140">subscribe</text>
    <text x="500" y="330">write</text>
  </g>
</svg>
